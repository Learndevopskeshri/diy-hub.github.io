<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakerVault - DIY Knowledge Engine</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #ffffff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        header p {
            color: #8b949e;
            font-size: 1.1rem;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-box input {
            flex: 1;
            padding: 14px 20px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        .search-box button {
            padding: 0 24px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-box button:hover {
            background-color: #2ea043;
        }

        .results-section h3 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            height: 180px;
            background-color: #21262d;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .platform-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #ffffff;
        }

        .badge-youtube { background-color: #ff0000; }
        .badge-reddit { background-color: #ff4500; }
        .badge-github { background-color: #24292e; }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-footer {
            margin-top: auto;
        }

        .watch-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .watch-btn:hover {
            text-decoration: underline;
        }

        .loading-spinner {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: #8b949e;
            font-size: 1.1rem;
        }

        .loading-spinner i {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-screwdriver-wrench"></i> MakerVault</h1>
            <p>DIY Knowledge Engine – Live Multi-Platform Search</p>
        </header>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search DIY projects, kits, Arduino, hydroponics..." onkeypress="if(event.key === 'Enter') performSearch()">
            <button onclick="performSearch()">Search</button>
        </div>

        <div class="results-section">
            <h3 id="results-title"><i class="fa-solid fa-fire"></i> Trending DIY Projects</h3>
            <div id="video-grid" class="grid">
                <!-- Dynamic cards load here -->
            </div>
        </div>
    </div>

    <script>
        // Fallback data if API requests fail
        const fallbackData = [
            {
                title: "How to Grow Mushrooms at Home (DIY Grow Kit Guide)",
                channel: "FreshCap Mushrooms",
                platform: "YouTube",
                badgeClass: "badge-youtube",
                iconClass: "fa-brands fa-youtube",
                thumbnail: "https://images.unsplash.com/photo-1541696432-82c6da8ce7bf?auto=format&fit=crop&w=600&q=80",
                url: "https://www.youtube.com/results?search_query=grow+mushrooms+at+home"
            },
            {
                title: "Build a Simple DIY Battery Powered Motor Toy",
                channel: "Make: Science & Tech",
                platform: "YouTube",
                badgeClass: "badge-youtube",
                iconClass: "fa-brands fa-youtube",
                thumbnail: "https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=600&q=80",
                url: "https://www.youtube.com/results?search_query=diy+battery+powered+motor+toy"
            },
            {
                title: "Arduino Beginner Guide: LED Matrix & Circuit",
                channel: "Circuit basics",
                platform: "YouTube",
                badgeClass: "badge-youtube",
                iconClass: "fa-brands fa-youtube",
                thumbnail: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=80",
                url: "https://www.youtube.com/results?search_query=arduino+beginner+guide"
            }
        ];

        // Your active YouTube API Key
        const YOUTUBE_API_KEY = "AIzaSyBjlenag75knNhH2FRECE3lZY01PviQp9Q";

        // Initial load with default search
        window.onload = () => {
            document.getElementById("search-input").value = "mushroom oyster";
            performSearch("mushroom oyster");
        };

        async function performSearch(customQuery = null) {
            const query = customQuery || document.getElementById("search-input").value.trim();
            const grid = document.getElementById("video-grid");
            const titleEl = document.getElementById("results-title");

            if (!query) return;

            titleEl.innerHTML = `<i class="fa-solid fa-layer-group"></i> Results for: "${query}"`;
            grid.innerHTML = `
                <div class="loading-spinner">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <p>Searching YouTube, Reddit, and GitHub for "${query}"...</p>
                </div>
            `;

            let combinedResults = [];

            // Detect browser location for region-specific YouTube results
            const userLang = navigator.language || navigator.userLanguage || 'en-US';
            const countryCode = userLang.split('-')[1] || 'IN';
            let ytSearchQuery = query;
            if (countryCode === 'IN') {
                ytSearchQuery += ' in India';
            }

            // --- 1. YouTube API ---
            if (YOUTUBE_API_KEY && YOUTUBE_API_KEY !== "YOUR_YOUTUBE_API_KEY_HERE") {
                try {
                    const ytEndpoint = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=4&q=${encodeURIComponent(ytSearchQuery)}&type=video&regionCode=${countryCode}&key=${YOUTUBE_API_KEY}`;
                    const response = await fetch(ytEndpoint);
                    const data = await response.json();

                    if (data.items) {
                        const ytCards = data.items.map(item => ({
                            title: item.snippet.title,
                            channel: item.snippet.channelTitle,
                            platform: "YouTube",
                            badgeClass: "badge-youtube",
                            iconClass: "fa-brands fa-youtube",
                            thumbnail: item.snippet.thumbnails.high.url,
                            url: `https://www.youtube.com/watch?v=${item.id.videoId}`
                        }));
                        combinedResults.push(...ytCards);
                    }
                } catch (err) {
                    console.error("YouTube Fetch Error:", err);
                }
            }

            // --- 2. Reddit DIY API (No Key Needed) ---
            try {
                const redditEndpoint = `https://www.reddit.com/r/diy/search.json?q=${encodeURIComponent(query)}&restrict_sr=1&limit=3`;
                const redditRes = await fetch(redditEndpoint);
                const redditData = await redditRes.json();

                if (redditData.data && redditData.data.children) {
                    const redditCards = redditData.data.children.map(post => {
                        const p = post.data;
                        let thumb = "https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=600&q=80";
                        if (p.thumbnail && p.thumbnail.startsWith("http")) {
                            thumb = p.thumbnail;
                        }
                        return {
                            title: p.title,
                            channel: `r/diy • u/${p.author}`,
                            platform: "Reddit",
                            badgeClass: "badge-reddit",
                            iconClass: "fa-brands fa-reddit",
                            thumbnail: thumb,
                            url: `https://reddit.com${p.permalink}`
                        };
                    });
                    combinedResults.push(...redditCards);
                }
            } catch (err) {
                console.error("Reddit Fetch Error:", err);
            }

            // --- 3. GitHub Repositories API (No Key Needed) ---
            try {
                const githubEndpoint = `https://api.github.com/search/repositories?q=${encodeURIComponent(query)}+topic:diy&per_page=3`;
                const ghRes = await fetch(githubEndpoint);
                const ghData = await ghRes.json();

                if (ghData.items) {
                    const ghCards = ghData.items.map(repo => ({
                        title: repo.name + " - " + (repo.description || "Open source DIY repo"),
                        channel: `GitHub • ${repo.owner.login}`,
                        platform: "GitHub",
                        badgeClass: "badge-github",
                        iconClass: "fa-brands fa-github",
                        thumbnail: repo.owner.avatar_url || "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=80",
                        url: repo.html_url
                    }));
                    combinedResults.push(...ghCards);
                }
            } catch (err) {
                console.error("GitHub Fetch Error:", err);
            }

            // --- Fallback if all APIs fail or return nothing ---
            if (combinedResults.length === 0) {
                combinedResults = fallbackData.filter(item => 
                    item.title.toLowerCase().includes(query.toLowerCase())
                );
            }

            renderCards(combinedResults);
        }

        function renderCards(items) {
            const grid = document.getElementById("video-grid");
            grid.innerHTML = "";

            if (items.length === 0) {
                grid.innerHTML = `<div class="loading-spinner"><p>No results found across platforms.</p></div>`;
                return;
            }

            items.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="thumbnail-container">
                        <img src="${item.thumbnail}" alt="${item.title}">
                        <div class="platform-badge ${item.badgeClass}">
                            <i class="${item.iconClass}"></i> ${item.platform}
                        </div>
                    </div>
                    <div class="card-body">
                        <h4 class="card-title">${item.title}</h4>
                        <div class="card-meta"><i class="fa-regular fa-circle-user"></i> ${item.channel}</div>
                        <div class="card-footer">
                            <a href="${item.url}" target="_blank" rel="noopener" class="watch-btn">
                                Explore <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
